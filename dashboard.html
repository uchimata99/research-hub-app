<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מרכז המחקר</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2f45">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3e1dc;
    --accent:#2f5d8a; --accent-soft:#e6eef6; --ok:#2e7d4f; --ok-soft:#e5f3ea;
    --warn:#a36b00; --warn-soft:#fbf1dc; --bad:#9b2c2c; --bad-soft:#f8e4e4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:#1f2f45;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;font-weight:600}
  header .meta{font-size:13px;opacity:.8}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:0;color:#cfd8e3;padding:8px 14px;border-radius:8px;font-size:15px;cursor:pointer}
  nav button.on{background:#ffffff1f;color:#fff;font-weight:600}
  main{max-width:1640px;margin:0 auto;padding:20px 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:16px;margin:16px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:13px;background:#faf9f7;position:sticky;top:var(--hdr-h,0px)}
  tr.click{cursor:pointer} tr.click:hover{background:#f3f6fa}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.gray{background:#eee;color:#555}
  button,.btn{text-decoration:none;display:inline-block;font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
  button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  button.ghost{background:transparent;color:var(--muted);padding:4px 8px;white-space:nowrap}
  button.done-btn{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;cursor:pointer}
  button.done-btn:hover{border-color:var(--accent);background:#f3f7fb}
  .done-btn{transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1)}
  button.done-btn:active,.nav-arrow:active{transform:scale(0.97)}
  .done-btn.is-done{display:inline-block;background:var(--ok);color:#fff;border:1px solid var(--ok);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
  button.done-btn.is-done:hover{background:var(--ok);filter:brightness(1.08);border-color:var(--ok)}
  .th-sort{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .th-sort .th-ar{font-size:10px;opacity:.45}
  .th-sort.on{color:var(--accent)} .th-sort.on .th-ar{opacity:1}
  .mtable tbody td{vertical-align:middle}
  .mtable th:nth-child(6),.mtable td:nth-child(6){text-align:center}
  .mtable th:last-child,.mtable td:last-child{text-align:center}
  .mtable th.th-col{vertical-align:top;padding-bottom:8px}
  .th-fw{margin-top:6px;font-weight:400}
  .th-f{width:100%;min-width:56px;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  .th-f.pr-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);font-weight:600}
  .th-f.pr-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);font-weight:600}
  .th-f.ty-acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
  .th-f.ty-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:600}
  .th-f.pr-gray{background:#eee;color:#555;font-weight:600}
  .th-f:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .add-task{background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 14px}
  .row-nav{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .row-pos{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
  .arr{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:8px;width:28px;height:28px;padding:0;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background-color 150ms ease,border-color 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1)}
  .arr:disabled{opacity:.3;cursor:default}
  .arr:not(:disabled):active{transform:scale(0.94)}
  @media (hover:hover) and (pointer:fine){ .arr:not(:disabled):not(.go):hover{border-color:var(--accent);background:#f3f7fb} }
  .nav-arrow{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:14px;transition:background-color 150ms ease,border-color 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1)}
  .nav-arrow:disabled{opacity:.4;cursor:default}
  .nav-arrow.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  @media (hover:hover) and (pointer:fine){ .nav-arrow:not(:disabled):not(.primary):hover{border-color:var(--accent);background:#f3f7fb} }
  @media (prefers-reduced-motion:reduce){ .done-btn,.nav-arrow{transition:none} button.done-btn:active,.nav-arrow:active{transform:none} }
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cfccc5;border-radius:8px;background:#fff}
  textarea{width:100%;min-height:70px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .muted{color:var(--muted);font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;color:var(--ink);font:inherit;cursor:pointer;transition:border-color 150ms ease,box-shadow 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1)}
  .stat-btn b{font-size:22px}
  .stat-btn:active{transform:scale(0.98)}
  .stat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stat-pop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:12;min-width:260px;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;padding:8px 10px;display:flex;flex-direction:column;gap:4px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1),visibility 0s 150ms;pointer-events:none}
  .sp-row{font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-more{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
  @media (hover:hover) and (pointer:fine){
    .stat-btn:hover{border-color:var(--accent);box-shadow:0 2px 10px #2f5d8a1a}
    .stat-btn:hover .stat-pop{opacity:1;visibility:visible;transform:none;transition-delay:250ms,250ms,0s}
  }
  .task-open{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:right;cursor:pointer;white-space:normal;line-height:1.45}
  .mtable .chip{white-space:normal;text-align:right;max-width:170px}
  @media (hover:hover) and (pointer:fine){ .task-open:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px} }
  .task-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin:8px 0}
  .fld textarea{font:inherit;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:6px;resize:vertical}
  .fld .th-f{min-width:90px}
  tr.flash td{background:var(--accent-soft);transition:background-color 600ms ease}
  .stat-list{list-style:none;margin:8px 0 0;padding:0}
  .stat-list li{padding:8px 0;border-bottom:1px solid var(--line)}
  .linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-align:right}
  .linkish:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){ .stat-btn,.stat-pop{transition:none} .stat-btn:active{transform:none} }
  .stat b{display:block;font-size:24px}
  .stages{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:10px 0 4px}
  .stg{font-size:12px;text-align:center;padding:8px 2px;border-radius:6px;background:#eee;color:#666;line-height:1.25}
  .stg.done{background:var(--ok-soft);color:var(--ok)} .stg.cur{background:var(--accent);color:#fff;font-weight:600}
  .mini{display:inline-flex;gap:2px;vertical-align:middle} .mini i{width:9px;height:9px;border-radius:2px;background:#ddd;display:inline-block}
  .mini i.d{background:#8cc7a1} .mini i.c{background:var(--accent)}
  .ltr{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px}
  .drop{border:2px dashed #b9c6d4;border-radius:12px;padding:26px;text-align:center;background:#fbfcfe}
  .drop.over{background:var(--accent-soft)}
  .setup-steps{list-style:none;padding:0;margin:8px 0 0}
  .setup-steps li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .setup-steps li.cur{border-color:var(--accent);background:var(--accent-soft)}
  .check{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
  .check input{margin-top:3px}
  pre.code{direction:ltr;text-align:left;background:#1f2328;color:#e6edf3;padding:10px 12px;border-radius:8px;overflow:auto;margin:6px 0;font-size:13px}
  .cmd{display:flex;gap:8px;align-items:center;margin:4px 0}
  .cmd pre{flex:1;margin:0}
  .modal-bg{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
  .modal{background:#fff;border-radius:14px;max-width:980px;width:100%;padding:20px}
  .modal-bg.float{position:fixed;inset:auto;top:0;left:0;width:0;height:0;padding:0;background:transparent;overflow:visible;display:block;pointer-events:none}
  .modal-bg.float .modal{position:fixed;pointer-events:auto;max-width:none;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);box-shadow:0 14px 44px #0f1a2a40,0 2px 6px #0f1a2a1f;padding-top:0}
  .modal-bg.float .drag-bar{position:sticky;top:0;z-index:2;background:#fff;margin:0 -20px 8px;padding:12px 20px 8px;border-bottom:1px solid var(--line);cursor:grab;user-select:none}
  .modal-bg.float .modal.pulse{animation:cardpulse 500ms cubic-bezier(0.23,1,0.32,1)}
  @keyframes cardpulse{0%{box-shadow:0 0 0 0 #2f5d8a66,0 14px 44px #0f1a2a40}100%{box-shadow:0 0 0 10px #2f5d8a00,0 14px 44px #0f1a2a40}}
  @media (prefers-reduced-motion:reduce){ .modal-bg.float .modal.pulse{animation:none} }
  .modal-bg.float .modal.dragging{opacity:.96} .modal-bg.float .modal.dragging .drag-bar{cursor:grabbing}
  .md h1{font-size:20px}.md h2{font-size:17px}.md table{margin:8px 0}
  .bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--accent)}
  .chip{background:var(--accent-soft);color:var(--accent);border:1px solid transparent;border-radius:8px;padding:4px 10px;font-size:13px;line-height:1.35;text-align:right;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip:hover{border-color:var(--accent)}
  .terms{display:block}
  .term{display:block;width:fit-content;margin-top:3px;background:#f1f0ec;color:#333;border-radius:6px;padding:1px 7px;font-weight:400}
  td .btn,td button{white-space:nowrap}
  details.more summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:2px}
  :root{--claude:#D97757}
  table.papers td.c-title{min-width:220px;max-width:300px}
  table.papers td.c-stage{width:120px}
  table.papers td.c-next{min-width:170px}
  table.papers td.c-missing{min-width:260px}
  table.papers td.c-data{min-width:140px}
  table.papers td.c-links{width:132px}
  .lb{display:block;box-sizing:border-box;width:124px;text-align:center;padding:6px 8px;margin:0 0 6px;border-radius:8px;font:inherit;font-size:13px;line-height:1.3;white-space:nowrap;text-decoration:none;cursor:pointer}
  a.lb.word{background:var(--accent);color:#fff;border:1px solid var(--accent)}
  .lb.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  a.lb.claude{background:var(--claude);color:#fff;border:1px solid var(--claude);font-weight:600}
  a.lb.claude small{font-weight:400;opacity:.9}
  .lb.ghost-b{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .claude-pill{background:var(--claude);color:#fff;border-radius:999px;padding:2px 10px;margin-inline-start:8px;text-decoration:none;font-weight:600}
  #demobar{background:#f5c542;color:#3a2c00;text-align:center;font-weight:600;padding:6px 12px;font-size:14px}
  .mode-btn{background:#ffffff26;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:2px 10px;font-size:13px}
  .mode-btn.on{background:#2e7d4f;border-color:#2e7d4f}
  #srvsw:empty{display:none}
  .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none;background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;padding:3px 10px 3px 4px}
  .sw input{position:absolute;opacity:0;width:1px;height:1px}
  .sw-track{position:relative;width:38px;height:20px;border-radius:999px;background:#ffffff40;transition:background .2s;flex:none}
  .sw-knob{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .2s}
  .sw input:checked+.sw-track{background:#2e7d4f}
  .sw input:checked+.sw-track .sw-knob{right:20px}
  .sw input:focus-visible+.sw-track{outline:2px solid #fff;outline-offset:2px}
  .sw input:disabled+.sw-track{opacity:.6}
  .sw-sub{opacity:.75;font-size:12px}
  header{position:relative}
  #srvsw{display:inline-flex;align-items:center;gap:10px;position:absolute;left:20px;top:12px}
  header:has(#srvsw:not(:empty)){padding-left:250px}
  @media (max-width:900px){ #srvsw{position:static} header:has(#srvsw:not(:empty)){padding-left:20px} }
  .cl-ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--claude);flex:none}
  .cl-ico:hover{filter:brightness(1.1)}
  .cl-ico svg{width:18px;height:18px}
  .eng-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa5b1;margin-inline-end:6px;vertical-align:middle}
  .eng-dot.ok{background:#4cc47e}
  .proj{position:relative}
  .proj-btn{background:#ffffff26;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:4px 12px;font-size:14px}
  .proj-menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px #0003;min-width:210px;padding:6px;z-index:25}
  .proj-menu button{display:block;width:100%;text-align:right;background:transparent;color:var(--ink);border-radius:6px;padding:6px 10px}
  .proj-menu button:hover{background:var(--accent-soft)}
  .proj-menu button.on{font-weight:600;color:var(--accent)}
  .proj-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  .chat{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:16px}
  .chat-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chat-log{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto;background:#fcfbf9}
  .bub{max-width:82%;border-radius:12px;padding:8px 12px;line-height:1.6;overflow-wrap:anywhere}
  .bub.me{align-self:flex-start;background:var(--accent-soft);color:var(--accent)}
  .bub.cl{align-self:flex-end;border:1px solid var(--line);background:#fff}
  .bub.cl.err{border-color:var(--bad)}
  .bub .md p{margin:4px 0}
  .bub .chg{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .bub .apv{margin-top:8px;padding:8px;border-radius:8px;background:var(--warn-soft)}
  .bub .meta{font-size:11px;color:var(--muted);margin-top:4px}
  .chat-prog{align-self:flex-end;font-size:12px;color:var(--muted)}
  .chat-f{border-top:1px solid var(--line);padding:10px 14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chips button{font-size:12px;padding:4px 10px;background:#fff;color:var(--accent);border:1px solid var(--line)}
  #chatin{min-height:44px}
  button.send{background:var(--claude)}
  .hidden{display:none}
  .toast{position:fixed;bottom:18px;left:18px;background:#1f2f45;color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
  .center{text-align:center;padding:50px 20px}
  pre.log{direction:ltr;text-align:left;background:#111;color:#cfe;padding:10px;border-radius:8px;max-height:280px;overflow:auto;font-size:12px;white-space:pre-wrap}
  /* חלון צר: כל שורה בטבלה הופכת לכרטיס, ושם העמודה מופיע ליד כל ערך */
  @media (max-width:900px){
    main{padding:12px}
    .card{padding:12px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .stages{grid-template-columns:repeat(3,1fr)}
    table.stack thead{display:none}
    table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
    table.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;background:var(--card)}
    table.stack td{border:0;padding:4px 0;display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:10px;align-items:baseline;overflow-wrap:break-word}
    table.stack td>*{grid-column:2;justify-self:start}
    table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12px;grid-column:1;grid-row:1 / span 9}
    table.stack td[data-label=""]{grid-template-columns:minmax(0,1fr)}
    table.stack td[data-label=""]>*{grid-column:1}
    table.stack td[data-label=""]::before{display:none}
    table.stack td.empty{display:none}
  }
  /* ===== חלון כפול ===== */
  .embed header,.embed #demobar{display:none}
  .embed main{padding:14px}
  .split-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:#c3cfdd;border:1px solid #ffffff26;border-radius:8px;padding:5px 10px;font-size:13px;transition:background-color 150ms ease,color 150ms ease}
  .split-btn[aria-pressed="true"]{background:#ffffff1c;color:#fff;border-color:#ffffff40}
  @media (hover:hover) and (pointer:fine){ .split-btn:hover{background:#ffffff12;color:#fff} }
  body.split main{max-width:none;margin:0 0 0 var(--split-w,50%);padding:16px}
  #split{position:fixed;left:0;top:var(--hdr-bot,var(--hdr-h,56px));bottom:0;width:var(--split-w,50%);display:flex;flex-direction:column;border-right:2px solid var(--line);background:var(--bg);z-index:5}
  .split-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
  .split-bar select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
  #split iframe{flex:1;width:100%;border:0;background:var(--bg)}
  .split-grip{position:absolute;top:0;bottom:0;right:-7px;width:12px;cursor:col-resize;z-index:6;touch-action:none;display:flex;align-items:center;justify-content:center}
  .split-grip::after{content:"";width:4px;height:44px;border-radius:3px;background:#b9c2cc;transition:background-color 150ms ease,height 150ms cubic-bezier(0.23,1,0.32,1)}

<main id="app"><div class="center">טוען…</div></main>

<script>
"use strict";
/* כותרת קבועה: גובה הכותרת לכותרות הטבלאות, וצל כשגוללים */
(function(){const h=document.querySelector("header");if(!h)return;
  const set=()=>document.documentElement.style.setProperty("--hdr-h",h.offsetHeight+"px");
  set(); if(window.ResizeObserver) new ResizeObserver(()=>{set();sc();}).observe(h); else addEventListener("resize",set);
  const sc=()=>{h.classList.toggle("scrolled",scrollY>4);document.documentElement.style.setProperty("--hdr-bot",Math.max(0,h.getBoundingClientRect().bottom)+"px");}; addEventListener("scroll",sc,{passive:true}); sc();})();
/* חלונות צפים: כרטיסים (מאמר, משימה, פירוט) נפתחים כחלונות שאפשר לגרור, כמה במקביל, והלוח נשאר זמין */
(function(){
  let z=40, n=0; const POS={};
  const wide=()=>innerWidth>=760;
  const front=bg=>{bg.style.zIndex=++z;};
  function floatify(bg){
    if(!wide()||bg.classList.contains("float")) return;
    const m=bg.querySelector(".modal"); if(!m) return;
    bg.classList.add("float"); front(bg);
    const w=Math.min(m.style.maxWidth?parseInt(m.style.maxWidth):780,innerWidth-24);
    const key=bg.dataset.key||""; m.style.width=w+"px";
    if(key&&POS[key]){ m.style.left=POS[key][0]+"px"; m.style.top=POS[key][1]+"px"; }
    else { const off=(n++%8)*28;
      m.style.left=Math.max(8,Math.min(innerWidth-w-8,(innerWidth-w)/2-80+off))+"px";
      m.style.top=Math.max(8,Math.min(innerHeight-160,(parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hdr-bot"))||60)+16+off))+"px"; }
    const keep=()=>{ if(key) POS[key]=[m.offsetLeft,m.offsetTop]; }; keep();
    bg.addEventListener("pointerdown",()=>front(bg),true);
    const bar=m.querySelector(".row"); if(!bar) return;
    bar.classList.add("drag-bar");
    bar.addEventListener("pointerdown",e=>{
      if(e.button!==0||e.target.closest("button,a,input,select,textarea,label")) return;
      const sx=e.clientX,sy=e.clientY,ox=m.offsetLeft,oy=m.offsetTop;
      bar.setPointerCapture(e.pointerId); m.classList.add("dragging");
      const mv=ev=>{m.style.left=Math.max(-w+80,Math.min(innerWidth-80,ox+ev.clientX-sx))+"px";m.style.top=Math.max(0,Math.min(innerHeight-40,oy+ev.clientY-sy))+"px";};
      const up=()=>{bar.removeEventListener("pointermove",mv);bar.removeEventListener("pointerup",up);m.classList.remove("dragging");keep();};
      bar.addEventListener("pointermove",mv); bar.addEventListener("pointerup",up);
    });
  }
  /* אם הכרטיס כבר פתוח: מביאים אותו לקדמה ומבליטים לרגע, במקום לפתוח עוד אחד */
  window.focusCard=key=>{const e=document.querySelector(`.modal-bg[data-key="${CSS.escape(key)}"]`); if(!e) return false; front(e);
    const m=e.querySelector(".modal"); if(m){m.classList.remove("pulse"); void m.offsetWidth; m.classList.add("pulse");} return true;};
  new MutationObserver(ms=>{for(const r of ms) for(const el of r.addedNodes) if(el.nodeType===1&&el.classList.contains("modal-bg")) floatify(el);})
    .observe(document.body||document.documentElement,{childList:true});
  /* Esc סוגר רק את החלון העליון */
  addEventListener("keydown",e=>{ if(e.key!=="Escape") return;
    const fl=[...document.querySelectorAll(".modal-bg.float")]; if(!fl.length) return;
    const top=fl.sort((a,b)=>(+b.style.zIndex||0)-(+a.style.zIndex||0))[0];
    e.stopImmediatePropagation(); e.preventDefault();
    const x=top.querySelector("#x"); if(x) x.click(); else top.remove();
  },true);
})();
/* ============ אחסון: גישה לתיקייה ============ */
const DB_NAME="research-hub", STORE="h";
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,k);t.oncomplete=()=>r();});}

/* ROOT = תיקיית הקוד (מרכז המחקר, שהיא גם פרויקט המרפאה). PROJ = תיקיית הפרויקט הפעיל (במרפאה: אותה תיקייה) */
let ROOT=null, PROJ=null;
/* קבצים שתמיד נמצאים בתיקיית הקוד, בכל פרויקט. אותו כלל כמו במנוע */
const CODE_HOME_RE=/^(config\/(stages|journals|links|machines|packages|projects|server|demo)\.json|library\/(instruments|lutz)\/|templates\/|claude-commands\/|\.runner\/(port|token|installs\.log)$)/;
function projPath(path){const p=String(path??"").replace(/\\/g,"/");return {home:CODE_HOME_RE.test(p),path:p};}
/* כשהלוח נפתח דרך המנוע, המנוע קורא וכותב את הקבצים. אחרת: גישת הדפדפן לתיקייה */
/* רק המנוע מזריק את המפתח לדף, גם כשהוא מוגש מרחוק דרך המנהרה המוגנת (מצב שרת). באתר הציבורי אין מפתח, ולכן בוחרים תיקייה */
const ENG=!!window.RUNNER_TOKEN&&location.origin!=="null";
const projQ=()=>"project="+encodeURIComponent(S.project||"clinic");
async function eng(ep,path,opt={}){
  const r=await fetch(`/fs/${ep}?path=${encodeURIComponent(path)}&${projQ()}`,{cache:"no-store",...opt,headers:{"X-Token":window.RUNNER_TOKEN,...(opt.headers||{})}});
  if(r.status===403) throw new Error("המנוע הופעל מחדש מאז שהדף נפתח. צריך לרענן את הדף.");
  if(!r.ok){let m=r.status;try{m=(await r.json()).error||m;}catch(e){} const err=new Error(String(m));err.status=r.status;throw err;}
  return r;
}
async function readBuf(path){ if(ENG) return (await eng("read",path)).arrayBuffer(); return (await (await fileAt(path)).getFile()).arrayBuffer(); }
/* home: איזו תיקייה (קוד או פרויקט). נקבע לפי הנתיב המלא, כי הכלל מסתיים לפעמים בלוכסן */
async function dirAt(path,create=false,home){
  const pp=projPath(path); if(home===undefined) home=projPath(pp.path+"/").home||pp.home;
  let d=home?ROOT:(PROJ||ROOT); if(!pp.path) return d;
  for(const part of pp.path.split("/").filter(Boolean)) d=await d.getDirectoryHandle(part,{create});
  return d;
}
async function fileAt(path,create=false){
  const pp=projPath(path); const parts=pp.path.split("/"); const name=parts.pop();
  const d=await dirAt(parts.join("/"),create,pp.home);
  return d.getFileHandle(name,{create});
}
async function exists(path){try{if(ENG){await eng("read",path);return true;}await fileAt(path);return true;}catch(e){return false;}}
async function readText(path){return new TextDecoder("utf-8").decode(await readBuf(path));}
async function readJSON(path,fallback){try{return JSON.parse(await readText(path));}catch(e){if(fallback!==undefined)return fallback;throw e;}}
async function writeText(path,text){await writeBlob(path,new Blob([text]));}
async function writeJSON(path,obj){await writeText(path,JSON.stringify(obj,null,2)+"\n");}
async function writeBlob(path,blob){
  if(ENG){await eng("write",path,{method:"POST",body:blob});return;}
  const h=await fileAt(path,true);const w=await h.createWritable();await w.write(blob);await w.close();
}
async function listEntries(path){
  if(ENG) return (await (await eng("list",path)).json());
  const out=[];const d=await dirAt(path);
  for await(const [n,h] of d.entries()){ if(h.kind==="file"){const f=await h.getFile();out.push({name:n,kind:"file",size:f.size,mtime:f.lastModified});} else out.push({name:n,kind:"directory"}); }
  return out;
}
async function listDirs(path){return (await listEntries(path)).filter(e=>e.kind==="directory").map(e=>e.name).sort();}

/* ============ עזרים ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const nowStamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
const daysSince=d=>d?Math.floor((Date.now()-new Date(d.slice(0,10)).getTime())/864e5):null;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
async function sha256(buf){const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast("הועתק"));}
const ltr=s=>`<span class="ltr">${esc(s)}</span>`;
/* כלל העיצוב: אין אותיות לועזיות בתוך משפט עברי. מונחים לועזיים יוצאים מהמשפט, וכל אחד מוצג בשורה משלו */
function heb(s){
  s=String(s??""); if(!/[A-Za-z]/.test(s)) return esc(s);
  if(!/[֐-׿]/.test(s)) return ltr(s);
  const terms=[];
  let prose=s.replace(/[A-Za-z][\w.\-\/\\:+@#']*(?:\s+[A-Za-z0-9][\w.\-\/\\:+@#']*)*/g,m=>{const t=m.replace(/[.,;:)]+$/,"");if(!terms.includes(t))terms.push(t);return m.slice(t.length);});
  prose=prose.replace(/\(\s*\)/g,"").replace(/\s+([.,;:])/g,"$1").replace(/\s{2,}/g," ").trim();
  return esc(prose)+`<span class="terms">${terms.map(t=>`<span class="ltr term">${esc(t)}</span>`).join("")}</span>`;
}

/* פענוח טבלת ערכים מופרדי פסיקים, כולל מירכאות */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"){row.push(f.replace(/\r$/,""));rows.push(row);row=[];f="";}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f.replace(/\r$/,""));rows.push(row);}
  return rows.filter(r=>r.length>1||r[0]!=="");
}
/* תאריך הורדה מתוך שם הקובץ: patients20261118_0912.csv */
function exportDateFromName(name){
  // patients-2026-11-17_09-46.csv  or  patients20261118_0912.csv
  const m=String(name).match(/(\d{4})-?(\d{2})-?(\d{2})(?:[_ T-]+(\d{2})[-:]?(\d{2}))?/);
  if(!m) return null;
  return `${m[1]}-${m[2]}-${m[3]}`+(m[4]?` ${m[4]}:${m[5]}`:"");
}

/* ============ מצב ============ */
/* מסך מפוצל: החצי השני הוא עותק של הלוח (embed=1) עם לשונית משלו */
const QP=new URLSearchParams(location.search); const EMBED=QP.get("embed")==="1";
if(EMBED) document.documentElement.classList.add("embed");
const S={stages:[],statuses:{},journals:[],papers:[],tasks:[],log:[],catalog:null,instruments:[],refs:[],tab:"morning",project:"clinic",projects:[]};

/* ============ פרויקטים ============ */
const CLINIC={id:"clinic",name:"מרפאה",path:".",kind:"clinic"};
const curProject=()=>S.projects.find(p=>p.id===S.project)||CLINIC;
const isGeneral=()=>curProject().kind==="general";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
/* רשימת הפרויקטים: מהמנוע, או מקובץ הרישום בבחירת תיקייה. כל כשל = רק המרפאה, כמו היום */
async function loadProjects(){
  let list=null;
  try{
    if(ENG){ list=(await chatApi("/projects")).projects;
      try{S.engProjects=!!(await (await fetch(RUN.url+"/status",{cache:"no-store"})).json()).projects;}catch(e){S.engProjects=false;} }
    else list=JSON.parse(await readText("config/projects.json"));
  }catch(e){ list=null; }
  if(!Array.isArray(list)) list=[];
  list=list.filter(p=>p&&typeof p.id==="string");
  if(!list.some(p=>p.id==="clinic")) list.unshift(CLINIC);
  S.projects=list;
  const id=EMBED&&QP.get("project")?QP.get("project"):lsGet("rh.project");
  S.project=list.some(p=>p.id===id)?id:"clinic";
}
/* הבורר מוצג רק כשיש יותר מפרויקט אחד, או כשהמנוע תומך בפרויקטים (גם בעותק ההדרכה: שם פרויקטי התרגול נשמרים בתוך עותק ההדרכה) */
const projectsOn=()=>S.projects.length>1||(ENG&&!!S.engProjects);
/* בחירת תיקייה: לכל פרויקט כללי בוחרים את התיקייה פעם אחת בדפדפן, והיא נשמרת */
async function projOk(h,id){
  try{const f=await (await (await h.getDirectoryHandle("config")).getFileHandle("project.json")).getFile();return JSON.parse(await f.text()).id===id;}catch(e){return false;}
}
async function projHandle(e){
  if(e.id==="clinic") return ROOT;
  const h=await idbGet("proj:"+e.id);
  if(h){ try{ if(await h.requestPermission({mode:"readwrite"})==="granted"&&await projOk(h,e.id)) return h; }catch(err){} }
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML=`<div class="modal" style="max-width:520px"><h2>תיקיית הפרויקט ${esc(e.name)}</h2>
      <p>בפעם הראשונה בדפדפן הזה יש לבחור את תיקיית הפרויקט בדרייב.</p><p class="muted">שם התיקייה:</p><p>${ltr(e.id)}</p>
      <div class="row"><button id="pp">בחירת תיקייה</button><button class="sec" id="pc">ביטול</button></div></div>`;
    document.body.appendChild(bg);
    const done=v=>{bg.remove();res(v);};
    bg.querySelector("#pc").onclick=()=>done(null);
    bg.querySelector("#pp").onclick=async()=>{
      try{ const d=await window.showDirectoryPicker({mode:"readwrite"});
        if(!(await projOk(d,e.id))){toast("זו לא תיקיית הפרויקט הזה");return;}
        await idbSet("proj:"+e.id,d); done(d);
      }catch(err){}
    };
  });
}
async function switchProject(id){
  const e=S.projects.find(p=>p.id===id); if(!e) return;
  const prev=S.project, prevProj=PROJ;
  if(!ENG){ const h=await projHandle(e); if(!h) return; PROJ=h; }
  S.project=id; lsSet("rh.project",id); if(S.chatKey!=="_training") S.chatKey="_main";  /* ההדרכה נשארת פתוחה גם כשעוברים לפרויקט התרגול */
  try{ await loadAll(); }catch(err){
    alert("שגיאה בקריאת תיקיית הפרויקט. נשארים בפרויקט הקודם.\n"+err.message);
    S.project=prev; PROJ=prevProj; lsSet("rh.project",prev); try{ await loadAll(); }catch(e2){}
  }
  renderNav(); render();
}
function engineNeeded(html,cmd){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" style="max-width:520px">${html}${cmd?`<div class="cmd"><pre class="code">${esc(cmd)}</pre><button class="sec" id="cc">העתק</button></div>`:""}
    <div class="row" style="margin-top:10px"><button class="sec" id="x">סגירה</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#x").onclick=()=>bg.remove(); bg.onclick=ev=>{if(ev.target===bg)bg.remove();};
  const c=bg.querySelector("#cc"); if(c) c.onclick=()=>copy(cmd);
}
function projErr(head,msg){
  msg=String(msg||"");
  if(/^Folder already exists/i.test(msg)){const m=msg.match(/:\s*(.+)$/);return "התיקייה של הפרויקט כבר קיימת. כנראה הוא נוצר במחשב אחר והדרייב עוד לא סיים לסנכרן. כדאי לחכות לסנכרון ולנסות שוב."+(m?"\n"+m[1]:"");}
  if(/already exists/i.test(msg)) return "כבר יש פרויקט בשם הזה. אפשר לבחור שם אחר.";
  return head+(msg?"\n"+msg:"");
}
async function newProject(){
  if(!ENG){ engineNeeded(`<p>יצירת פרויקט חדש דורשת את מנוע הניתוח. אפשר לבקש מקלוד קוד:</p>`,"/new-project"); return; }
  const name=(prompt("שם הפרויקט:")||"").trim(); if(!name) return;
  let r; try{ r=await chatApi("/project/new",{method:"POST",body:JSON.stringify({name})}); }catch(e){ r={error:e.message}; }
  if(!r||!r.id){ alert(projErr("הפרויקט לא נוצר.",r&&r.error)); return; }
  S.tab="morning"; /* הפרויקט החדש נפתח בלוח הבוקר, עם כרטיס הקמת הפרויקט */
  await loadProjects(); await switchProject(r.id); toast("הפרויקט נוצר");
}
async function renameProject(){

function morningItems(){
  const items=[]; const le=latestExport();
  for(const p of S.papers){
    if(p.status!=="active") continue;
    const st=stageOf(p.stage);
    const fresh = p.snapshot && le && le.id!==p.snapshot.export_id && p.stage<=3;
    items.push({kind:"next",type:st.work,text:p.next_step||"להגדיר צעד הבא",paper:p,pr:p.priority||3,age:daysSince(p.updated_at),
      extra:(p.missing||[]).filter(Boolean),flag:fresh?"יש ייצוא חדש יותר מהתמונה הקפואה":""});
    if(p.stage>=2) for(const a of (p.analyses||[])) if(a.status==="open"||a.status==="running")
      items.push({kind:"analysis",type:"ניתוח",text:a.name,paper:p,pr:(p.priority||3)-0.5,age:daysSince(p.updated_at),aid:a.id,extra:[]});
  }
  for(const t of S.tasks) if(t.status==="open")
    items.push({kind:"task",type:t.type,text:t.title,paper:paperById(t.paper),pr:t.priority||3,age:daysSince(t.created_at),tid:t.id,extra:t.note?[t.note]:[]});
  items.sort((a,b)=>b.pr-a.pr||(b.age||0)-(a.age||0));
  return items;
}

/* פריטים שבוצעו: משימות, ניתוחים, וצעדים במאמרים (מתוך ההיסטוריה). מהישן לחדש */
function doneItems(){
  const out=[];
  for(const t of S.tasks) if(t.status==="done")
    out.push({kind:"task",done:true,at:t.done_at||"",type:t.type,text:t.title,paper:paperById(t.paper),pr:t.priority||3,tid:t.id,extra:[]});
  for(const p of S.papers){
    for(const a of (p.analyses||[])) if(a.status==="done")
      out.push({kind:"analysis",done:true,at:a.done_at||"",type:"ניתוח",text:a.name,paper:p,pr:p.priority||3,aid:a.id,extra:[]});
    for(const h of (p.history||[])) if(/^בוצע: /.test(h.event||""))
      out.push({kind:"next",done:true,at:String(h.at||"").slice(0,10),hat:h.at,type:stageOf(p.stage).work,text:h.event.slice(6),paper:p,pr:p.priority||3,extra:[]});
  }
  return out.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
}
const itemKey=i=>[i.done?"d":"o",i.kind,i.tid||i.aid||"",i.paper?i.paper.id:"",i.hat||"",(i.kind==="next"&&!i.done)?"":i.text].join("|");
async function markDone(i){
  if(i.kind==="task"){const t=S.tasks.find(x=>x.id===i.tid);t.status="done";t.done_at=today();await saveTasks();
    return itemKey({...i,done:true});}
  if(i.kind==="analysis"){const a=i.paper.analyses.find(x=>x.id===i.aid);a.status="done";a.done_at=today();addHistory(i.paper,`ניתוח הושלם: ${a.name}`);await savePaper(i.paper);
    return itemKey({...i,done:true});}
  const n=prompt("מה הצעד הבא במאמר?",""); if(n===null) return null;
  addHistory(i.paper,`בוצע: ${i.paper.next_step}`); const h=i.paper.history[i.paper.history.length-1];
  i.paper.next_step=n; await savePaper(i.paper);
  return itemKey({kind:"next",done:true,paper:i.paper,hat:h.at,text:h.event.slice(6)});
}
async function reopen(i){
  if(i.kind==="task"){const t=S.tasks.find(x=>x.id===i.tid);t.status="open";t.done_at=null;await saveTasks();return itemKey({...i,done:false});}
  if(i.kind==="analysis"){const a=i.paper.analyses.find(x=>x.id===i.aid);a.status="open";a.done_at=null;addHistory(i.paper,`ניתוח נפתח מחדש: ${a.name}`);await savePaper(i.paper);return itemKey({...i,done:false});}
  return null;
}

/* מסננים ומיון לכל עמודה בלוח הבוקר (חוץ משלב) */
const MCOLS=[["pr","עדיפות"],["type","סוג"],["text","פעולה"],["paper","מאמר"],["stage",""],["age","ימים"]];
const paperName=p=>p?(p.short||p.title):"";
function mVal(i,c){
  if(c==="pr") return Math.round(i.pr);
  if(c==="type") return i.type||"";
  if(c==="text") return i.text||"";
  if(c==="paper") return paperName(i.paper)||"ללא מאמר";
  if(c==="age") return i.done?-1:(i.age??-1);
  return "";
}
function mPass(i,F){
  if(F.pr&&String(Math.round(i.pr))!==F.pr) return false;
  if(F.type&&i.type!==F.type) return false;
  if(F.paper&&mVal(i,"paper")!==F.paper) return false;
  if(F.text&&!String(i.text+" "+(i.extra||[]).join(" ")).toLowerCase().includes(F.text.toLowerCase())) return false;
  if(F.age&&!i.done&&!((i.age??0)>+F.age)) return false;
  return true;
}
/* כרטיסי הסיכום: ריחוף מציג את הרשימה, לחיצה פותחת חלון עם הפירוט המלא */
function statData(items,active,le){
  const line=i=>({t:i.text,sub:[i.paper?paperName(i.paper):"",i.type].filter(Boolean).join(" · "),gk:i.paper?"p:"+i.paper.id:"t:"+i.type,ik:itemKey(i)});
  const L=[{k:"papers",label:"מאמרים פעילים",n:active.length,
      rows:active.slice().sort((a,b)=>b.stage-a.stage).map(p=>({t:p.short||p.title,sub:`שלב ${p.stage}: ${stageOf(p.stage).name}`+(p.next_step?` · הצעד הבא: ${p.next_step}`:""),pid:p.id}))},
    {k:"write",label:"כתיבה",n:0,rows:items.filter(i=>i.type==="כתיבה").map(line)},
    {k:"anal",label:"ניתוחים פתוחים",n:0,rows:items.filter(i=>i.type==="ניתוח").map(line)}];
  if(!isGeneral()) L.push({k:"clinic",label:"משימות למרפאה",n:0,rows:items.filter(i=>i.type==="מרפאה").map(line)});
  L.push({k:"exp",label:"ימים מאז הייצוא האחרון",n:le?daysSince(le.uploaded_at):"—",
    rows:le?[{t:`${isGeneral()?"קובץ נתונים אחרון":"ייצוא אחרון"}: ${dmy(le.export_date||String(le.uploaded_at||"").slice(0,10))}`,sub:[le.rows?`${le.rows} שורות`:"",le.patients?`${le.patients} מטופלים`:"",le.claude_summary||""].filter(Boolean).join(" · ")}]:[{t:"עוד לא נקלט קובץ",sub:""}]});
  for(const x of L) if(x.k!=="papers"&&x.k!=="exp") x.n=x.rows.length;
  return L;
}
function statCards(items,active,le){
  S.statL=statData(items,active,le);

  </button>`).join("")}</div>`;

function renderMorning(){

     ימינה (›) אחורה למה שכבר בוצע, שמאלה (‹) קדימה למשימות הפתוחות האחרות */
  const gk=i=>i.paper?"p:"+i.paper.id:"t:"+i.type;
  const groups=new Map();
  for(const i of shown){ if(!groups.has(gk(i))) groups.set(gk(i),{open:[],done:[]}); groups.get(gk(i)).open.push(i); }
  for(const i of done){ const g=groups.get(gk(i)); if(g) g.done.push(i); }
  S.rowPos=S.rowPos||{};
  const rows=[...groups.entries()].map(([k,g])=>{
    const seq=g.done.concat(g.open);
    let x=seq.findIndex(i=>itemKey(i)===S.rowPos[k]); if(x<0) x=g.done.length;
    return {k,seq,x,cur:seq[x],nOpen:g.open.length,nDone:g.done.length,top:g.open[0]};
  });
  /* מיון לפי המשימה הפתוחה הראשונה של כל שורה, כדי שהשורות לא יקפצו כשמדפדפים */
  const cmp=(a,b)=>{const va=mVal(a.top,SO.col),vb=mVal(b.top,SO.col);
    const r=typeof va==="number"&&typeof vb==="number"?va-vb:String(va).localeCompare(String(vb),"he");
    return r*SO.dir||(b.top.pr-a.top.pr)||((b.top.age||0)-(a.top.age||0));};
  rows.sort(cmp);
  /* אחרי לחיצה בשורה (חץ או בוצע) שומרים על סדר השורות, כדי שהשורה לא תקפוץ */
  if(S.mKeep&&S.mOrder){const o=new Map(S.mOrder.map((k,ix)=>[k,ix]));rows.sort((a,b)=>(o.has(a.k)?o.get(a.k):1e9)-(o.has(b.k)?o.get(b.k):1e9));}
  S.mKeep=false; S.mOrder=rows.map(r=>r.k);
  const uniq=(c)=>[...new Set(items.map(i=>String(mVal(i,c))))].sort((a,b)=>c==="pr"?b-a:a.localeCompare(b,"he"));

    text:`<input class="th-f" data-f="text" type="search" placeholder="חיפוש" value="${esc(F.text)}" aria-label="חיפוש בפעולה">`,
    paper:sel("paper",uniq("paper").map(v=>[v,v])),stage:"",age:sel("age",[["7","מעל 7"],["30","מעל 30"]])};
  const anyF=Object.values(F).some(Boolean);

  ${statCards(items,active,le)}

      `<th class="th-col"><button class="th-sort ${SO.col===c?"on":""}" data-sort="${c}" title="מיון">${l}<span class="th-ar">${SO.col===c?(SO.dir<0?"▼":"▲"):"↕"}</span></button><div class="th-fw">${filt[c]}</div></th>`).join("")}<th></th></tr>

      </div>${r.seq.length>1?`<div class="row-pos">${pos}</div>`:""}</td></tr>`;}).join("")}
    </tbody></table>

/* מה חסר: שני פריטים, והשאר נפתח בלחיצה */
function missingCell(p){
  const m=p.missing||[]; const li=x=>`<div>• ${heb(x)}</div>`;
  if(m.length<=3) return m.map(li).join("");
  return m.slice(0,2).map(li).join("")+`<details class="stop more"><summary>ועוד ${m.length-2}</summary>${m.slice(2).map(li).join("")}</details>`;
}
/* על איזה נתונים המאמר נשען: קפוא, ראשוני או לא רלוונטי */
const dmy=d=>{const m=String(d||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[3]}.${+m[2]}.${m[1]}`:"?";};
function dataCell(p){
  if(p.snapshot) return `<span class="pill ok">קפוא</span><div>ייצוא מ־${dmy(p.snapshot.export_date)}</div><div class="muted">הוקפא ב־${dmy(p.snapshot.frozen_at)}</div>`;
  if(p.kind&&p.kind!=="empirical") return `<span class="muted">לא רלוונטי</span>`;
  if(p.data_basis&&p.data_basis.export_date) return `<span class="pill warn">ראשוני, לא קפוא</span><div>ייצוא מ־${dmy(p.data_basis.export_date)}</div>${p.data_basis.note?`<div class="muted">${heb(p.data_basis.note)}</div>`:""}`;
  return `<span class="pill gray">עוד לא נבחר ייצוא</span>`;
}
/* טיוטה: קובץ וורד בתיקיית המאמר, נפתח ישירות בוורד */
const isDraft=f=>/\.docx$/i.test(f.name)&&!f.name.startsWith("~$");
function wordLink(rel){
  /* הקישור נבנה מהתיקייה המוחלטת של הפרויקט הפעיל; במרפאה: הנתיב מהגדרות הקישורים */
  const hub=(S.project==="clinic"||!S.project?(S.links.hub_path||""):(curProject().root||"")).replace(/\\/g,"/").replace(/\/$/,""); if(!hub) return null;
  return "ms-word:ofe|u|file:///"+(hub+"/"+rel).split("/").map((x,i)=>i===0?x:encodeURIComponent(x)).join("/");
}
function draftCell(p){
  const d=(S.drafts[p.id]||[])[0]; let out="";
  if(d){ const rel=`papers/${p.id}/manuscript/${d.name}`, url=wordLink(rel);
    out=url?`<a class="lb word stop" href="${esc(url)}" title="עודכן ${dmy(new Date(d.mtime).toISOString())}">פתח בוורד</a>`:`<a href="#" class="lb sec stop" data-local="${esc(rel)}">הורד עותק</a>`;
  } else out=`<button class="lb sec stop" data-newdraft="${esc(p.id)}">צור טיוטה</button>`;
  return out;
}
/* שיחה עם קלוד לכל מאמר: קישור נפרד לכל מחשב, כי שיחות לא עוברות בין מחשבים. הזיכרון המשותף הוא יומן העבודה */
function sessionCell(p){
  const ss=p.sessions||{};
  let out=Object.keys(ss).map(k=>`<a class="lb claude stop" href="${esc(ss[k])}">קלוד<small> · ${esc((S.machines[k]||{}).label||k)}</small></a>`).join("");
  if(S.worklogs[p.id]) out+=`<button class="lb ghost-b stop" data-md2="papers/${esc(p.id)}/worklog.md">יומן עבודה</button>`;
  if(/^https?:/.test(p.draft_url||"")) out+=`<a class="stop muted" style="font-size:12px" href="${esc(p.draft_url)}" target="_blank">טיוטה קודמת אצל קלוד</a>`;
  return out;
}
async function createDraft(p){
  const name=`${p.id}-draft.docx`, rel=`papers/${p.id}/manuscript/${name}`;
  try{
    if(await exists(rel)){toast("כבר יש טיוטה בשם הזה");return;}
    await writeBlob(rel,new Blob([await readBuf("templates/paper/manuscript/draft-template.docx")]));
    addHistory(p,"נוצרה טיוטת וורד בתיקיית המאמר"); await savePaper(p);
    S.drafts[p.id]=(await listFiles(`papers/${p.id}/manuscript`)).filter(isDraft); toast("הטיוטה נוצרה"); renderPapers();
  }catch(e){alert("לא הצלחתי ליצור טיוטה: "+e.message);}
}
const journalName=id=>(S.journals.find(j=>j.id===id)||{name:id}).name;
function statusPill(s){const cls={active:"",paused:"warn",cancelled:"bad",accepted:"ok"}[s]||"gray";return `<span class="pill ${cls}">${esc(S.statuses[s]||s)}</span>`;}
async function newPaper(){
  const title=prompt("כותרת המאמר (בעברית או באנגלית):"); if(!title) return;
  let id=prompt("מזהה קצר לתיקייה, באותיות לטיניות קטנות ומקפים בלבד:",""); if(!id) return;
  id=id.toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  if(paperById(id)){toast("המזהה כבר קיים");return;}
  const p={id,title,kind:"empirical",stage:1,status:"active",priority:3,next_step:"לנסח את שאלת המחקר",missing:[],draft_url:"",target_journal:"",coauthors:[],snapshot:null,snapshots:[],analyses:[],submissions:[],gates:{},history:[{at:nowStamp(),event:"נוצר במערכת"}],notes:"",updated_at:today()};
  await writeJSON(`papers/${id}/paper.json`,p);
  for(const sub of ["R","outputs","snapshot"]) await writeText(`papers/${id}/${sub}/.keep`,"");
  await writeText(`papers/${id}/worklog.md`,`# יומן עבודה — ${title}\n\nכל שיחה על המאמר הזה קוראת את היומן בתחילתה, ומוסיפה רשומה בסופו. הרשומה האחרונה היא הנקודה שבה עצרנו.\n\n## ${today()} · המאמר נוצר\n**הצעד הבא:** ${p.next_step||"להגדיר"}\n`);
  S.papers.push(p); toast("נוצר"); openPaper(id);
}

  document.body.appendChild(bg);

    if(st==="revise"){ p.next_step=`תיקונים לפי הסוקרים של ${s.journal}`; if(p.stage!==9&&confirm("לעבור לשלב 9, תיקונים וקבלה?")){addHistory(p,`מעבר לשלב 9: הוחזר לתיקונים מ־${s.journal}`);p.stage=9;} }
    if(st==="rejected"){ p.next_step="לבחור את כתב העת הבא ולהגיש"; if(p.stage!==8&&confirm("לחזור לשלב 8 כדי להגיש לכתב העת הבא? ההיסטוריה נשמרת.")){addHistory(p,`חזרה לשלב 8 אחרי דחייה מ־${s.journal}`);p.stage=8;} }
    if(st==="accepted"){ p.next_step=`התקבל ל־${s.journal}`; if(p.status!=="accepted"&&confirm(`לסמן את המאמר כ"התקבל" ל־${s.journal}?`)){p.status="accepted";p.accepted_journal=s.journal;addHistory(p,`המאמר התקבל ל־${s.journal}`);} }
    await reopen();
  });
  const rc=bg.querySelector("#runcard"); if(rc) fillRunCard(p,rc);
  const fr=bg.querySelector("#freeze");
  if(fr) fr.onclick=()=>freezeForPaper(p,$("#exp").value,bg);
}

async function freezeForPaper(p,exportId,bg){
  const e=S.log.find(x=>x.id===exportId); if(!e) return;
  if(p.snapshot && !confirm("למאמר כבר יש תמונה קפואה. הקפאה חדשה תשנה את בסיס הנתונים של המאמר, והקודמת תישמר. להמשיך?")) return;
  try{
    const buf=await readBuf("exports/archive/"+e.stored_as); const h=await sha256(buf);
    if(h!==e.sha256){alert("טביעת האצבע של הקובץ בארכיון לא תואמת ליומן. הקובץ שונה אחרי הקליטה. לא הוקפא.");return;}
    const n=(p.snapshots||[]).length+1; const sid=`${p.id}-s${n}`;
    await writeBlob(`papers/${p.id}/snapshot/${e.stored_as}`,new Blob([buf]));
    const snap={id:sid,export_id:e.id,export_date:e.export_date,file:e.stored_as,sha256:h,rows:e.rows,frozen_at:nowStamp()};
    await writeJSON(`papers/${p.id}/snapshot/snapshot.json`,snap);
    p.snapshots=p.snapshots||[]; p.snapshots.push(snap); p.snapshot=snap;
    addHistory(p,`הוקפא ייצוא מתאריך ${e.export_date||"?"} (${sid})`);
    e.used_by=[...new Set([...(e.used_by||[]),p.id])]; await saveLog();
    await savePaper(p); toast("הוקפא"); bg.remove(); openPaper(p.id);
  }catch(err){alert("שגיאה בהקפאה: "+err.message);}
}

const sign=n=>n==null?"?":(n>0?"+":"")+n;
async function ingest(file){
  const buf=await file.arrayBuffer(); const h=await sha256(buf);
  const dup=S.log.find(e=>e.sha256===h);
  if(dup){alert(`הקובץ הזה כבר נקלט ב-${dup.uploaded_at} (אותה טביעת אצבע). לא נקלט שוב.`);return;}
  let rows=null,cols=null,patients=null,idcol=null,therapists=null,intakeBlock=null;
  if(/\.(csv|txt)$/i.test(file.name)){
    const text=new TextDecoder("utf-8").decode(buf).replace(/^﻿/,"");
    const t=parseCSV(text); if(t.length){cols=t[0].length;rows=t.length-1;
      const hdr=t[0].map(x=>x.toLowerCase());
      let ix=hdr.findIndex(x=>/uuid/.test(x)); if(ix<0) ix=hdr.findIndex(x=>/patient|client|מטופל/.test(x));
      if(ix>=0){idcol=t[0][ix];patients=new Set(t.slice(1).map(r=>r[ix]).filter(Boolean)).size;}
      const cm=hdr.findIndex(x=>x.trim()==="case manager");
      if(cm>=0) therapists=new Set(t.slice(1).map(r=>(r[cm]||"").trim()).filter(Boolean)).size;
      intakeBlock=t[0].some(h=>/^Intake questionnaire /i.test(h.trim()));
    }
  }
  let stored=file.name;
  if(await exists("exports/archive/"+stored)){const dot=stored.lastIndexOf(".");stored=stored.slice(0,dot)+"__"+Date.now()+stored.slice(dot);}
  const prev=latestExport();
  const entry={id:"x"+Date.now().toString(36),uploaded_at:nowStamp(),export_date:exportDateFromName(file.name),original_name:file.name,stored_as:stored,
    sha256:h,bytes:buf.byteLength,rows,cols,patients,therapists,intake_block:intakeBlock,id_column:idcol,
    delta:prev?{rows:(rows!=null&&prev.rows!=null)?rows-prev.rows:null,patients:(patients!=null&&prev.patients!=null)?patients-prev.patients:null,cols:(cols!=null&&prev.cols!=null)?cols-prev.cols:null}:null,
    note:"",claude_summary:"",used_by:[]};
  $("#ingest").innerHTML=`<div class="card" style="margin-top:12px">
    <p>הקובץ ${ltr(file.name)}</p>
    <p>תאריך הורדה מזוהה: <b>${esc(entry.export_date||"לא זוהה")}</b> · שורות: ${rows??"?"} · עמודות: ${cols??"?"} · מטופלים: ${patients??"?"}</p>
    ${idcol?`<p class="muted">עמודת המזהה שזוהתה:</p><p>${ltr(idcol)}</p>`:""}
    ${therapists!=null?`<p>מטפלים בקובץ: ${therapists} (השמות לא נשמרים ביומן)</p>`:""}
    ${intakeBlock===false?`<p><span class="pill bad">אזהרה: בקובץ אין את גוש שאלוני הקליטה. כנראה זה סוג הייצוא החלקי. מומלץ להוריד את הייצוא המלא.</span></p>`:intakeBlock?`<p><span class="pill ok">גוש שאלוני הקליטה קיים</span></p>`:""}
    ${entry.delta?`<p>לעומת הייצוא הקודם: שורות ${sign(entry.delta.rows)}, מטופלים ${sign(entry.delta.patients)}, עמודות ${sign(entry.delta.cols)}</p>`:""}
    <label class="f">מה ידוע על הייצוא הזה, ואיך הוא אמור להשפיע על העבודה? (לא חובה)</label>
    <textarea id="enote"></textarea>
    <button id="esave" style="margin-top:8px">שמור בארכיון וביומן</button></div>`;
  $("#esave").onclick=async()=>{
    entry.note=$("#enote").value.trim();
    await writeBlob("exports/archive/"+stored,new Blob([buf]));
    S.log.push(entry); await saveLog();
    toast("נקלט ונשמר"); renderNav(); renderData();
  };
}

function md(src){
  const lines=src.split("\n");let out="",inCode=false,code=[],inList=false,table=[];
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,'<span class="ltr">$1</span>');
  const flushTable=()=>{if(!table.length)return;const rows=table.filter(r=>!/^\|[\s|:-]+\|$/.test(r));out+="<table>"+rows.map((r,i)=>"<tr>"+r.split("|").slice(1,-1).map(c=>i?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join("")+"</tr>").join("")+"</table>";table=[];};
  for(const l of lines){
    if(l.startsWith("```")){ if(inCode){out+=`<pre class="code">${esc(code.join("\n"))}</pre>`;code=[];inCode=false;} else {if(inList){out+="</ul>";inList=false;}flushTable();inCode=true;} continue; }
    if(inCode){code.push(l);continue;}
    if(l.startsWith("|")){table.push(l);continue;} else flushTable();
    if(/^- /.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inline(l.slice(2))}</li>`; continue; }
    if(inList){out+="</ul>";inList=false;}
    const h=l.match(/^(#{1,3}) (.*)/); if(h){out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue;}
    if(l.trim()) out+=`<p>${inline(l)}</p>`;
  }
  if(inList) out+="</ul>"; flushTable(); return out;
}

async function switchMode(){
  const to=RUN.info.mode==="server"?"home":"server";

  const j=await r.json(); if(!j.job){box.innerHTML=`<p><span class="pill bad">המנוע סירב להריץ</span></p><pre class="log">${esc(j.error||"")}</pre>`;return;}
  const poll=async()=>{
    const s=await (await fetch(RUN.url+"/job?id="+j.job,{cache:"no-store",headers:{"X-Token":RUN.token||""}})).json();
    const st={running:"רץ",starting:"מתחיל",done:"הסתיים בהצלחה",failed:"נכשל"}[s.status]||s.status;
    box.innerHTML=`<p><span class="pill ${s.status==="done"?"ok":s.status==="failed"?"bad":""}">${esc(st)}</span> <span class="muted">${esc(script)}</span></p>${s.installed&&[].concat(s.installed).length?`<p><span class="pill ok">נוספה חבילה: ${esc([].concat(s.installed).join(", "))}</span></p>`:""}<pre class="log">${esc(s.log||"")}</pre>`;
    const lg=box.querySelector("pre"); lg.scrollTop=lg.scrollHeight;
    if(s.status==="done"||s.status==="failed"){ if(onDone) onDone(s); } else setTimeout(poll,1500);
  };
  setTimeout(poll,800);
}
async function listFiles(path){let out=[];try{out=(await listEntries(path)).filter(e=>e.kind==="file"&&!e.name.startsWith("."));}catch(e){}return out.sort((a,b)=>a.name.localeCompare(b.name));}
const MIME={html:"text/html",txt:"text/plain",md:"text/plain",csv:"text/plain",png:"image/png",pdf:"application/pdf",svg:"image/svg+xml"};
async function openLocal(path){const name=path.split("/").pop(),ext=(name.split(".").pop()||"").toLowerCase();
  const f=new Blob([await readBuf(path)],{type:(MIME[ext]||"application/octet-stream")+(/^(html|txt|md|csv)$/.test(ext)?";charset=utf-8":"")});
  const url=URL.createObjectURL(f);const a=document.createElement("a");a.href=url;a.target="_blank";if(!MIME[ext])a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function fillRunCard(p,card){
  const scripts=(await listFiles(`papers/${p.id}/R`)).filter(f=>/\.R$/.test(f.name));
  const outs=await listFiles(`papers/${p.id}/outputs`);
  card.innerHTML=`<h3>הרצת ניתוחים במחשב הזה</h3>
    ${RUN.ok?`<p class="muted">המנוע מחובר. הקוד רץ במחשב הזה, על התמונה הקפואה בלבד.</p>`:ENGINE_OFF}
    ${scripts.map(s=>`<div class="cmd"><span class="grow">${ltr(s.name)}</span><button class="sec" data-run="${esc(s.name)}" ${p.snapshot?"":"disabled title='אין תמונה קפואה'"}>הרץ</button></div>`).join("")||`<p class="muted">אין קבצי קוד בתיקיית המאמר.</p>`}
    ${p.snapshot?"":`<p class="muted">צריך להקפיא ייצוא לפני הרצה.</p>`}
    <div id="runbox"></div>
    <h3>פלטים</h3>
    ${outs.map(o=>`<div class="cmd"><span class="grow">${ltr(o.name)}</span><span class="muted">${new Date(o.mtime).toLocaleString("he-IL")}</span><button class="ghost" data-out="${esc(o.name)}">פתח</button></div>`).join("")||`<p class="muted">עוד אין פלטים.</p>`}`;
  card.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>runJob(`papers/${p.id}/R/${b.dataset.run}`,p.id,card.querySelector("#runbox"),async s=>{
    addHistory(p,`הורץ ${b.dataset.run}: ${s.status==="done"?"הצליח":"נכשל"}`);await savePaper(p);const keep=card.querySelector("#runbox").innerHTML;await fillRunCard(p,card);card.querySelector("#runbox").innerHTML=keep;}));
  card.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>openLocal(`papers/${p.id}/outputs/${b.dataset.out}`));
}
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="127.0.0.1"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});

boot();
</script>
